name: chezmoi-verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apply:
    name: chezmoi apply --dry-run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Real init: renders .chezmoi.toml.tmpl; --promptDefaults ticks every package.
      - name: chezmoi init
        run: |
          chezmoi init --source="$GITHUB_WORKSPACE" --no-tty --promptDefaults \
              --promptString "Git name=CI,Git email=ci@example.com"
          cat "$HOME/.config/chezmoi/chezmoi.toml"

      - name: chezmoi apply --dry-run
        run: chezmoi apply --dry-run --no-tty --verbose
